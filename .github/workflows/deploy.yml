# Deploys the site to the Digital Ocean box.
#
# Restored from the version deleted in July 2026 (52178a8). That version
# passed the key as `sshPrivateKey`, but this action's input is
# `SSH_PRIVATE_KEY` (verified against action.yml at v5.1.0) — Actions does
# not fuzzy-match input names, so the key never reached the action and the
# deploy could not have worked. That is very likely why it was removed as
# "app is no longer deployed". Fixed here.
#
# The served directory is not yet confirmed: this workflow's predecessor
# targeted /var/www/html/URInvited/ while deploy.sh targets
# /var/www/html/urinvited, and those are different directories on Linux.
# Until that is settled:
#
#   * TARGET comes from the repository variable DEPLOY_TARGET, so it can be
#     corrected without editing this file (Settings > Secrets and variables >
#     Actions > Variables). It falls back to deploy.sh's lowercase path,
#     which is the one most recently used by hand.
#
#   * SCRIPT_BEFORE lists /var/www/html and the candidate directories on
#     every run, so the job log says plainly which one exists and which one
#     nginx is serving. Check it after the first run and set DEPLOY_TARGET.
#
#   * ARGS is the action's default and contains no --delete, so deploying to
#     the wrong path is useless rather than destructive. Once DEPLOY_TARGET
#     is confirmed, adding --delete makes files deleted from the repo also
#     disappear from the server.

name: Deploy URInvited

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-urinvited
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy key is configured
        env:
          KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret DO_SSH_PRIVATE_KEY is not set on this repository."
            echo "Add it under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          echo "Deploy key present."
          echo "Target: ${{ vars.DEPLOY_TARGET || '/var/www/html/urinvited' }}"

      - name: Deploy via rsync over SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          REMOTE_HOST: 64.227.108.128
          REMOTE_USER: root
          TARGET: ${{ vars.DEPLOY_TARGET || '/var/www/html/urinvited' }}
          ARGS: -rlgoDzvc -i
          EXCLUDE: >-
            .git/,
            .github/,
            .gitignore,
            .DS_Store,
            .claude/,
            .aios_relay/,
            deploy.sh,
            *.md
          SCRIPT_BEFORE: |
            echo "--- which directory is actually served? ---"
            ls -la /var/www/html/ || true
            for d in /var/www/html/urinvited /var/www/html/URInvited; do
              if [ -d "$d" ]; then
                echo "EXISTS: $d ($(ls -1 "$d" | wc -l) entries)"
              else
                echo "absent: $d"
              fi
            done
            echo "--- nginx roots/aliases mentioning urinvited ---"
            grep -rin "urinvited" /etc/nginx/ 2>/dev/null || echo "(no nginx match)"

      - name: Summary
        run: |
          {
            echo "Deployed \`${GITHUB_SHA:0:7}\` to \`${{ vars.DEPLOY_TARGET || '/var/www/html/urinvited' }}\`"
            echo ""
            echo "Live at https://webapps.peoplestar.com/URInvited/"
            echo ""
            echo "If this is the first run, open the deploy step's log and read the"
            echo "\"which directory is actually served\" section, then set the"
            echo "DEPLOY_TARGET repository variable if the path above is wrong."
          } >> "$GITHUB_STEP_SUMMARY"
