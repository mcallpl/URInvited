# Deploys the site to the Digital Ocean box.
#
# Restored from the version deleted in July 2026 (52178a8). That version
# passed the key as `sshPrivateKey`, but this action's input is
# `SSH_PRIVATE_KEY` (verified against action.yml at v5.1.0) — Actions does
# not fuzzy-match input names, so the key never reached the action and the
# deploy could not have worked. That is very likely why it was removed as
# "app is no longer deployed". Fixed here.
#
# The site has its own document root, /var/www/urinvited, served only by the
# urinvited.peoplestar.com vhost. It deliberately does NOT live under
# /var/www/html any more: the old location was also served at
# webapps.peoplestar.com/URInvited/, which has no auth of its own and would
# therefore expose the private workspace. Keeping the roots separate means
# that even an unpatched webapps vhost cannot serve it.
#
# DO_SSH_PRIVATE_KEY is a DEDICATED key, not a general root login. On the
# server its authorized_keys entry is:
#
#   command="/usr/bin/rrsync -wo /var/www/urinvited",restrict ssh-ed25519 ...
#
# so the key can only rsync INTO /var/www/urinvited (-wo = write-only) and
# cannot open a shell, forward ports, or reach anything else on the box --
# which matters, because that host also runs TextGopher, mlspoppy, ReportPoppy,
# RecordIt and runpayway. Verified: `ssh -i key ... whoami` is refused with
# "SSH_ORIGINAL_COMMAND does not run rsync".
#
# Three consequences for this file, all deliberate:
#
#   TARGET is "/" -- paths are relative to the rrsync lock directory, so the
#   absolute /var/www/urinvited would be wrong here. DEPLOY_TARGET below is
#   now only used for the log line and the summary.
#
#   No SCRIPT_BEFORE / SCRIPT_AFTER. The restricted key refuses arbitrary
#   commands by design, so the old mkdir and chown hooks cannot run. The
#   directory already exists, and files land root:root 0644, which nginx
#   (running as www-data) can read -- chown was never actually required.
#
#   ARGS drops -g and -o. Preserving owner/group would stamp the GitHub
#   runner's uid onto the server's files. It still carries no --delete; add
#   that once a deploy to the new root is confirmed.
#
# Testing this from macOS will fail misleadingly: Apple ships openrsync
# (protocol 29), which does not send the "." argument rrsync requires, so
# rrsync rejects it before any option check. GitHub's ubuntu-latest runners
# have real rsync 3.x. Test it with a workflow run, not from a Mac.

name: Deploy URInvited

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-urinvited
  cancel-in-progress: false

env:
  DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || '/var/www/urinvited' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy key is configured
        env:
          KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret DO_SSH_PRIVATE_KEY is not set on this repository."
            echo "Add it under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          echo "Deploy key present. Target: $DEPLOY_TARGET"

      - name: Deploy via rsync over SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          REMOTE_HOST: 64.227.108.128
          REMOTE_USER: root
          TARGET: /
          ARGS: -rlptDzvc -i
          EXCLUDE: >-
            .git/,
            .github/,
            .gitignore,
            .DS_Store,
            .claude/,
            .aios_relay/,
            deploy.sh,
            deploy/,
            *.md

      - name: Summary
        run: |
          {
            echo "Deployed \`${GITHUB_SHA:0:7}\` to \`$DEPLOY_TARGET\`"
            echo ""
            echo "Workspace: https://urinvited.peoplestar.com/ (password protected)"
            echo "An event:  https://urinvited.peoplestar.com/PhilMcAllister/ (public)"
          } >> "$GITHUB_STEP_SUMMARY"
