# Deploys the site to the Digital Ocean box.
#
# Restored from the version deleted in July 2026 (52178a8). That version
# passed the key as `sshPrivateKey`, but this action's input is
# `SSH_PRIVATE_KEY` (verified against action.yml at v5.1.0) — Actions does
# not fuzzy-match input names, so the key never reached the action and the
# deploy could not have worked. That is very likely why it was removed as
# "app is no longer deployed". Fixed here.
#
# The site has its own document root, /var/www/urinvited, served only by the
# urinvited.peoplestar.com vhost. It deliberately does NOT live under
# /var/www/html any more: the old location was also served at
# webapps.peoplestar.com/URInvited/, which has no auth of its own and would
# therefore expose the private workspace. Keeping the roots separate means
# that even an unpatched webapps vhost cannot serve it.
#
# TARGET is still overridable via the DEPLOY_TARGET repository variable
# (Settings > Secrets and variables > Actions > Variables).
#
# ARGS is the action's default and carries no --delete. Add --delete once the
# first deploy to the new root is confirmed, so files removed from the repo
# also disappear from the server.

name: Deploy URInvited

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-urinvited
  cancel-in-progress: false

env:
  DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || '/var/www/urinvited' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy key is configured
        env:
          KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret DO_SSH_PRIVATE_KEY is not set on this repository."
            echo "Add it under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          echo "Deploy key present. Target: $DEPLOY_TARGET"

      - name: Deploy via rsync over SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          REMOTE_HOST: 64.227.108.128
          REMOTE_USER: root
          TARGET: ${{ env.DEPLOY_TARGET }}
          ARGS: -rlgoDzvc -i
          EXCLUDE: >-
            .git/,
            .github/,
            .gitignore,
            .DS_Store,
            .claude/,
            .aios_relay/,
            deploy.sh,
            deploy/,
            *.md
          SCRIPT_BEFORE: |
            mkdir -p ${{ env.DEPLOY_TARGET }}
          SCRIPT_AFTER: |
            chown -R www-data:www-data ${{ env.DEPLOY_TARGET }} || true
            echo "--- is the retired path still serving the app? ---"
            for d in /var/www/html/urinvited /var/www/html/URInvited; do
              [ -d "$d" ] && echo "STILL PRESENT: $d — remove it once the subdomain is confirmed working"
            done
            grep -rl "URInvited" /etc/nginx/sites-enabled/ 2>/dev/null \
              | grep -v urinvited.peoplestar.com \
              || echo "(no other vhost references URInvited)"

      - name: Summary
        run: |
          {
            echo "Deployed \`${GITHUB_SHA:0:7}\` to \`$DEPLOY_TARGET\`"
            echo ""
            echo "Workspace: https://urinvited.peoplestar.com/ (password protected)"
            echo "An event:  https://urinvited.peoplestar.com/PhilMcAllister/ (public)"
          } >> "$GITHUB_STEP_SUMMARY"
