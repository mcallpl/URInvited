# Retire webapps.peoplestar.com/URInvited/
#
# The app now lives at its own subdomain. This is not installed automatically,
# because it has to go inside a vhost this project does not own — paste it into
# the server block for webapps.peoplestar.com, then `nginx -t` and reload.
#
# Why it matters beyond tidiness: that vhost has no auth_basic of its own. If
# it is still serving the site's directory, the private workspace is reachable
# there with no password at all. Deploying to /var/www/urinvited already stops
# that, since the old directory is no longer updated — but delete the old
# directory too, and add this so stale links still land somewhere sensible.

location = /URInvited {
    return 301 https://urinvited.peoplestar.com/;
}

location ^~ /URInvited/ {
    return 301 https://urinvited.peoplestar.com/;
}

# Old links handed to guests pointed at Phil's invitation, which used to be
# served directly from /URInvited/. If any are still circulating, send them to
# the invitation rather than to the password-protected workspace by using
# these two blocks instead of the pair above:
#
# location = /URInvited {
#     return 301 https://urinvited.peoplestar.com/PhilMcAllister/;
# }
#
# location ^~ /URInvited/ {
#     return 301 https://urinvited.peoplestar.com/PhilMcAllister/;
# }
