# Temporary HTTP-only vhost, used once so certbot can answer the ACME
# challenge before any certificate exists. setup-ssl.sh replaces this with
# the full TLS vhost as soon as the certificate is issued.

server {
    listen 80;
    server_name urinvited.peoplestar.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    root __DOCROOT__;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
