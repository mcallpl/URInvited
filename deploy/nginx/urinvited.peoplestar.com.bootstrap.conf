# Temporary HTTP-only vhost, used once so certbot can answer the ACME
# challenge before any certificate exists. setup-ssl.sh replaces it with the
# full TLS vhost as soon as the certificate is issued. No content is served
# from here beyond the challenge itself.

server {
    listen 80;
    server_name urinvited.peoplestar.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 503;
    }
}
