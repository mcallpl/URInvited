# Shared response headers.
#
# These have to be repeated in every location that sets a header of its own:
# nginx's add_header REPLACES the inherited set rather than merging with it,
# so a location that adds Cache-Control silently drops these unless it
# includes this file too.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Enable only after HTTPS has been confirmed working for a few days: once a
# browser sees this it refuses plain HTTP for the host until it expires,
# which makes a broken certificate much harder to diagnose. Deliberately no
# includeSubDomains (it must not affect other peoplestar.com hosts) and no
# preload.
# add_header Strict-Transport-Security "max-age=15768000" always;
