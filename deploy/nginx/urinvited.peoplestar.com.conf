# urinvited.peoplestar.com — UR Invited served at a domain root.
#
# Installed by deploy/setup-ssl.sh. The __DOCROOT__ placeholder is replaced
# with the real document root at install time.
#
# This does not touch the existing webapps.peoplestar.com vhost: the site
# stays reachable at https://webapps.peoplestar.com/URInvited/ as well, so
# links already handed to guests keep working. All paths in this project are
# relative, so the same files serve correctly from both a subdirectory and a
# domain root.

server {
    listen 80;
    server_name urinvited.peoplestar.com;

    # Certbot renewals must stay reachable over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name urinvited.peoplestar.com;

    root __DOCROOT__;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/urinvited.peoplestar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/urinvited.peoplestar.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Turn this on only after HTTPS has been confirmed working for a few days.
    # Once a browser sees it, that browser refuses plain HTTP for this host
    # until it expires, which makes a broken certificate much harder to
    # debug. Deliberately no includeSubDomains — this must not affect the
    # other peoplestar.com hosts — and no preload.
    # add_header Strict-Transport-Security "max-age=15768000" always;

    # A Content-Security-Policy is left off rather than guessed at. The page
    # legitimately loads: Google Fonts CSS and font files, Google Maps in an
    # iframe, the Memento recorder in an iframe, and inline <script>/<style>
    # (the event config is an inline assignment). A policy therefore needs at
    # least:
    #   default-src 'self';
    #   script-src 'self' 'unsafe-inline';
    #   style-src  'self' 'unsafe-inline' https://fonts.googleapis.com;
    #   font-src   'self' https://fonts.gstatic.com;
    #   img-src    'self' data: https:;
    #   media-src  'self';
    #   frame-src  https://*.google.com https://app.memento.com;
    # Verify in a browser console before enabling — a wrong policy silently
    # blanks the maps and the video recorder.

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;

    # Deny rules must come before the caching rules below: nginx tries regex
    # locations in file order, so a .json under .aios_relay/ would otherwise
    # match the cache rule and be served before this was ever reached.
    location ~ /\.(?!well-known) { deny all; }
    location ~* /(?:deploy\.sh|README\.md|CLAUDE\.md)$ { deny all; }

    # Nothing here is content-hashed, and event.js *is* the content of an
    # event, so HTML, JS and CSS must revalidate or edits will not show up.
    # 304s make that cheap.
    location ~* \.(?:html|js|json|css)$ {
        # add_header in a location REPLACES the server-level set rather than
        # adding to it, so the security headers are repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    # Images, video and fonts change rarely and are replaced under new names.
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|mp4|webm|woff2?)$ {
        # No "expires" directive here: it emits its own Cache-Control and
        # would duplicate the header set below.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ =404;
    }
}
