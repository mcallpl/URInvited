# urinvited.peoplestar.com
#
# Two audiences, one document root:
#
#   /                     the private workspace — HTTP Basic auth
#   /builder.html         the event builder      — HTTP Basic auth
#   /<EventName>/         a guest's invitation   — PUBLIC, no password
#
# Guests must never hit a password prompt, so auth is applied to the
# workspace files specifically rather than to the whole site. The shared
# assets stay public because every event page loads them; only
# assets/events-index.js — the list of all events — is protected.
#
# Installed by deploy/setup-ssl.sh, which replaces __DOCROOT__ with the real
# document root and creates the password file.
#
# The existing webapps.peoplestar.com/URInvited/ vhost is untouched, so links
# already given to guests keep working.

server {
    listen 80;
    server_name urinvited.peoplestar.com;

    # Certbot renewals must stay reachable over plain HTTP, and unauthenticated.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        auth_basic off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name urinvited.peoplestar.com;

    root __DOCROOT__;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/urinvited.peoplestar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/urinvited.peoplestar.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    include snippets/urinvited-headers.conf;

    # A Content-Security-Policy is left off rather than guessed at. The event
    # pages legitimately load Google Fonts CSS and fonts, Google Maps in an
    # iframe, the Memento recorder in an iframe, and inline <script>/<style>.
    # A working policy needs at least:
    #   default-src 'self'; script-src 'self' 'unsafe-inline';
    #   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    #   font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:;
    #   media-src 'self'; frame-src https://*.google.com https://app.memento.com;
    # Verify in a browser console first — a wrong policy silently blanks the
    # maps and the video recorder.

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;

    # ---- private: the workspace -------------------------------------------
    # Exact (=) matches take priority over the regex blocks further down, so
    # these four keep their own headers and must repeat the shared ones.

    location = / {
        auth_basic "UR Invited workspace";
        auth_basic_user_file /etc/nginx/.htpasswd-urinvited;
        include snippets/urinvited-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /index.html {
        auth_basic "UR Invited workspace";
        auth_basic_user_file /etc/nginx/.htpasswd-urinvited;
        include snippets/urinvited-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /builder.html {
        auth_basic "UR Invited workspace";
        auth_basic_user_file /etc/nginx/.htpasswd-urinvited;
        include snippets/urinvited-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # The roster of every event: workspace-only, though each event page itself
    # stays public.
    location = /assets/events-index.js {
        auth_basic "UR Invited workspace";
        auth_basic_user_file /etc/nginx/.htpasswd-urinvited;
        include snippets/urinvited-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # ---- never served ------------------------------------------------------
    # These come before the caching rules below: nginx tries regex locations in
    # file order, so a .json under a dot-directory would otherwise match the
    # json cache rule and be served before this was reached.

    location ~ /\.(?!well-known) { deny all; }
    location ~* /(?:deploy\.sh|README\.md|CLAUDE\.md)$ { deny all; }
    location ^~ /deploy/ { deny all; }

    # ---- public: guests ----------------------------------------------------

    location = /robots.txt {
        include snippets/urinvited-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Nothing is content-hashed and event.js *is* an event's content, so these
    # must revalidate or edits will not show up. 304s make that cheap.
    location ~* \.(?:html|js|json|css)$ {
        include snippets/urinvited-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Images and video change rarely and are replaced under new names. No
    # "expires" directive here — it emits its own Cache-Control and would
    # duplicate the header.
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|mp4|webm|woff2?)$ {
        include snippets/urinvited-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # Event folders sit at the document root, so /PhilMcAllister/ is a plain
    # directory and nginx redirects /PhilMcAllister to it automatically.
    location / {
        try_files $uri $uri/ =404;
    }
}
